[General]
; F3 is intentionally different from PopDrop's default F2, so both apps can
; be evaluated side by side. Any valid AutoHotkey v2 hotkey is accepted.
Hotkey=F3
AlwaysOnTop=1
BarTitle=Vic快捷栏
UIFontName=Microsoft YaHei UI
UIFontSize=9
WindowWidth=1080
WindowHeight=680
PreviewWidth=270
PreviewHeight=520
ViewMode=Medium
HistoryLimit=30
LastSource=1

[Sources]
Count=4

[Source1]
Name=桌面素材
Path=%A_Desktop%

[Source2]
Name=下载素材
Path=%USERPROFILE%\Downloads

[Source3]
Name=图片素材
Path=%USERPROFILE%\Pictures

[Source4]
Name=文档素材
Path=%A_MyDocuments%

[Screenshots]
Name=历史截图
Path=%USERPROFILE%\Pictures\Screenshots

[Text]
Name=历史文本
Path=%A_ScriptDir%\data\text-blocks
